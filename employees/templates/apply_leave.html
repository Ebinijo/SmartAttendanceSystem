<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apply Leave</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{

    width:550px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);

}

.icon{
    text-align:center;
    font-size:70px;
    margin-bottom:15px;
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:gray;
    margin-bottom:30px;
}

label{
    font-weight:bold;
    color:#444;
}

input,
textarea{

    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;

    border:1px solid #ccc;
    border-radius:10px;

    font-size:15px;

}

textarea{
    resize:none;
}

button{

    width:100%;
    padding:14px;

    border:none;

    background:#ff9800;

    color:white;

    font-size:18px;
    border-radius:10px;

    cursor:pointer;
    transition:0.3s;

}

button:hover{

    background:#f57c00;

}

.back{

    display:block;
    text-align:center;
    margin-top:20px;

    text-decoration:none;
    color:#667eea;

    font-weight:bold;

}

.info{

    background:#f5f5f5;

    padding:15px;

    border-radius:10px;

    margin-bottom:20px;

    color:#555;

}

</style>

</head>

<body>

<div class="container">

    <div class="icon">
        📝
    </div>

    <h1>Leave Application</h1>

    <p class="subtitle">
        Submit your leave request for approval
    </p>

    <div class="info">

        Please provide accurate leave dates and
        a valid reason for your leave request.

    </div>

    <form method="POST">

        {% csrf_token %}

        <label>
            From Date
        </label>

        <input
        type="date"
        name="from_date"
        required>

        <label>
            To Date
        </label>

        <input
        type="date"
        name="to_date"
        required>

        <label>
            Reason
        </label>

        <textarea
        name="reason"
        rows="5"
        placeholder="Enter leave reason..."
        required>
        </textarea>

        <button type="submit">

            🚀 Submit Leave Request

        </button>

    </form>

    <a href="/dashboard/" class="back">

        ← Back to Dashboard

    </a>

</div>

</body>
</html>
