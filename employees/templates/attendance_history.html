<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance History</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:90%;
    max-width:900px;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);

}

.header{

    text-align:center;
    margin-bottom:30px;

}

.header h1{

    color:#333;
    margin-bottom:10px;

}

.header p{

    color:#666;

}

.summary{

    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:30px;

}

.box{

    background:#f8f9fa;
    padding:15px 25px;
    border-radius:12px;
    text-align:center;
    min-width:150px;

}

.box h3{

    color:#667eea;

}

table{

    width:100%;
    border-collapse:collapse;

}

th{

    background:#667eea;
    color:white;
    padding:15px;

}

td{

    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;

}

.present{

    background:#2ecc71;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    font-weight:bold;
}

tr:hover{

    background:#f3f3f3;

}

.back{

    display:inline-block;
    margin-top:25px;
    text-decoration:none;
    background:#764ba2;
    color:white;
    padding:12px 20px;
    border-radius:10px;

}

.back:hover{

    background:#5e3a85;

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>📊 Attendance History</h1>

        <p>Your attendance records are displayed below</p>

    </div>

    <div class="summary">

        <div class="box">

            <h3>{{ records|length }}</h3>

            <p>Total Records</p>

        </div>

        <div class="box">

            <h3>✅</h3>

            <p>Attendance</p>

        </div>

    </div>

    <table>

        <tr>

            <th>Date</th>

            <th>Status</th>

        </tr>

        {% for record in records %}

        <tr>

            <td>
                {{ record.date }}
            </td>

            <td>

                <span class="present">
                    {{ record.status }}
                </span>

            </td>

        </tr>

        {% endfor %}

    </table>

    <center>

        <a href="/dashboard/" class="back">

            ← Back to Dashboard

        </a>

    </center>

</div>

</body>
</html>
