<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>
</head>
<body>

<h2>Add Employee</h2>

<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="name"
           placeholder="Name">

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email">

    <br><br>

    <input type="text"
           name="phone"
           placeholder="Phone">

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password">

    <br><br>

    <button type="submit">
        Add Employee
    </button>

</form>

</body>
</html>
