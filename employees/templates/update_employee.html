<!DOCTYPE html>
<html>
<head>
    <title>Update Employee</title>
</head>
<body>

<h2>Update Employee</h2>

<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="name"
           value="{{ employee.name }}">

    <br><br>

    <input type="email"
           name="email"
           value="{{ employee.email }}">

    <br><br>

    <input type="text"
           name="phone"
           value="{{ employee.phone }}">

    <br><br>

    <button type="submit">
        Update
    </button>

</form>

</body>
</html>
