<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mark Attendance</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.card{

    width:500px;
    background:white;
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);

}

.icon{
    font-size:70px;
    margin-bottom:15px;
}

h1{
    color:#333;
    margin-bottom:10px;
}

.date{

    background:#f5f5f5;
    padding:12px;
    border-radius:10px;
    margin-top:20px;
    margin-bottom:20px;
    color:#555;
    font-weight:bold;

}

.info{

    margin-bottom:25px;
    color:#666;
    line-height:1.6;

}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2ecc71;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;

}

button:hover{

    background:#27ae60;

}

.back{

    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:#667eea;
    font-weight:bold;

}

.status{

    margin-top:15px;
    color:green;
    font-weight:bold;

}

</style>

</head>

<body>

<div class="card">

    <div class="icon">
        📅
    </div>

    <h1>Mark Attendance</h1>

    <div class="date">
        Today's Attendance
    </div>

    <p class="info">

        Click the button below to mark yourself
        present for today.

    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">

            ✅ Mark Present

        </button>

    </form>

    <a href="/dashboard/" class="back">

        ← Back to Dashboard

    </a>

</div>

</body>
</html>
