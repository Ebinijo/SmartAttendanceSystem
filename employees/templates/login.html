<!DOCTYPE html>
<html>
<head>
    <title>Employee Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .login-box{
            width:400px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:#667eea;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#5563d6;
        }

        .register{
            text-align:center;
            margin-top:15px;
        }

        .register a{
            text-decoration:none;
            color:#667eea;
            font-weight:bold;
        }

        .error{
            text-align:center;
            color:red;
            margin-top:10px;
        }

    </style>

</head>
<body>

<div class="login-box">

    <h2>Employee Login</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <p class="error">
        {{ error }}
    </p>

    <div class="register">
        Don't have an account?
        <a href="/register/">
            Register
        </a>
    </div>

</div>

</body>
</html>
