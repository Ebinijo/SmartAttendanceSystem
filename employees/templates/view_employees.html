<!DOCTYPE html>
<html>
<head>
    <title>Employees</title>
</head>
<body>

<h2>Employee List</h2>

<table border="1">

<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Actions</th>
</tr>

{% for employee in employees %}

<tr>

<td>{{ employee.name }}</td>

<td>{{ employee.email }}</td>

<td>{{ employee.phone }}</td>

<td>

<a href="/update-employee/{{employee.id}}/">
Update
</a>

|

<a href="/delete-employee/{{employee.id}}/">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
